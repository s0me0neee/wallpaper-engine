[package]
name = "wallpaper-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
# libav bindings, used in-process instead of driving the ffmpeg CLI. Needs the
# ffmpeg development libraries at build time (`brew install ffmpeg`), and the
# major version tracks ffmpeg's own — 9.x builds against ffmpeg 9.
ffmpeg-next = "9.0.0"
# GL function loader/bindings, driven through a context glutin opens.
glow = "0.18.0"
glsl-include = "0.3.1"
glutin = "0.32.3"
# Wires a glutin GL context to a real winit window, for the live simulator —
# the headless exporter still uses the hidden-NSWindow trick above instead.
# Its default features are all Linux windowing systems (x11/wayland/egl/wgl);
# CGL, macOS's, needs none of them.
glutin-winit = { version = "0.5", default-features = false }
image = { version = "0.25.10", default-features = false, features = [
	"png",
	"jpeg",
	"gif",
	"bmp",
	"tga",
	"rayon",
] }
# Wallpaper Engine stores bare LZ4 *blocks* with no length prefix, so only the
# block API is used. `safe-decode` keeps the hot path free of `unsafe`, which
# matters because Workshop packages are untrusted input.
lz4_flex = { version = "0.14.0", default-features = false, features = [
	"std",
	"safe-decode",
	"safe-encode",
] }
# CGL has no true surfaceless or pbuffer surface, only a window's; these three
# build the one never-shown NSWindow the GL context attaches to.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSGraphics", "NSView", "NSResponder"] }
objc2-foundation = "0.3"
# Encodes the PNGs we generate for raw-pixel textures. Textures whose payload is
# already an encoded image are passed through byte-for-byte and never hit this.
png = "0.18.1"
raw-window-handle = "0.6.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# BC1/BC2/BC3 decoding for DXT1/DXT3/DXT5 textures.
texpresso = "2.0.2"
walkdir = "2.5.0"
# The simulator's visible window and event loop. `rwh_06` is the
# raw-window-handle version glutin-winit 0.5 bridges through.
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
todo = "deny"
panic = "deny"
exit = "deny"

[profile.release]
opt-level = 3
